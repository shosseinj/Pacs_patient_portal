server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # This pinned image supplies compressed bundles with empty plain counterparts.
    gzip_static always;
    gunzip on;
    location = /app-config.js {
        gzip_static off;
        add_header Cache-Control no-store;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
