<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>{% block title %}تصاویر پزشکی{% endblock %}</title><link rel="stylesheet" href="/portal/static/styles.css"><script defer src="/portal/static/app.js"></script></head><body>
<header class="topbar"><a class="brand" href="/portal"><span class="brandmark">✚</span><span>تصاویر پزشکی<small>سامانهٔ امن تصاویر بیماران</small></span></a>{% if user %}<nav><span>{{ user.display_name }}</span>{% if user.role=='admin' %}<a href="/portal/admin">مدیریت</a>{% endif %}<form action="/portal/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost" type="submit">خروج</button></form></nav>{% endif %}</header>
<main class="container">{% block content %}{% endblock %}</main><footer>تصاویر پزشکی · دسترسی شخصی و ثبت‌شده</footer></body></html>
