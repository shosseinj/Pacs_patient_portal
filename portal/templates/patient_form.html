{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">پروندهٔ جدید</span><h1>ثبت بیمار</h1></div><a href="/portal">بازگشت</a></div><form class="card form-grid" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>نام بیمار<input name="name" maxlength="120" required></label><label>شمارهٔ پروندهٔ مرکز<input name="record_number" maxlength="64" required></label><label>Patient ID در DICOM<input name="dicom_id" dir="ltr" maxlength="64"><small>شناسهٔ دستگاه؛ اگر خالی باشد انتشار نیازمند تأیید مدیر است.</small></label><label>Issuer of Patient ID<input name="issuer" dir="ltr" maxlength="64"><small>مقدار صادرکننده در فایل DICOM؛ ممکن است خالی باشد.</small></label><label>نام کاربری بیمار<input name="username" dir="ltr" pattern="[a-zA-Z0-9_.\-]{3,64}" minlength="3" maxlength="64" required autocomplete="off"></label><label>گذرواژهٔ بیمار<input name="password" type="password" dir="ltr" minlength="12" maxlength="1024" required autocomplete="new-password"><small>حداقل ۱۲ نویسه؛ تحویل گذرواژه از مسیر امن مرکز.</small></label><div class="full"><button class="primary" type="submit">ساخت پرونده و حساب بیمار</button></div></form>{% endblock %}
